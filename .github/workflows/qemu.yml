name: QEMU build

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  QEMU_VERSION: '11.1.1'

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ contains(fromJson('["arm","aarch64"]'), matrix.target) && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: [ arm, aarch64, riscv64 ]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build-Abhängigkeiten installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential ninja-build pkg-config patch curl xz-utils file python3 python3-venv python3-pip libglib2.0-dev libpcre2-dev zlib1g-dev

      - name: QEMU-Quellen laden
        run: |
          set -euo pipefail
          curl -fsSLO "https://download.qemu.org/qemu-${QEMU_VERSION}.tar.xz"
          tar -xf "qemu-${QEMU_VERSION}.tar.xz"
          cd "qemu-${QEMU_VERSION}"
          patch -p1 --no-backup-if-mismatch < "${GITHUB_WORKSPACE}/qemu-execve/apply-execve-JH.patch"
          patch -p1 --no-backup-if-mismatch < "${GITHUB_WORKSPACE}/qemu-execve/zz-execve-native-passthrough.patch"

      - name: Build QEMU
        run: |
          set -euo pipefail
          mkdir build
          cd build
          "../qemu-${QEMU_VERSION}/configure" \
            --static \
            --target-list="${{ matrix.target }}-linux-user" \
            --disable-system \
            --disable-tools \
            --disable-docs \
            --disable-guest-agent \
            --disable-plugins \
            --disable-download
          ninja -C . -j"$(nproc)" "qemu-${{ matrix.target }}"

      - name: Paket erstellen
        run: |
          set -euo pipefail
          name="qemu-${{ matrix.target }}"
          pkg="qemu-${QEMU_VERSION}-${{ matrix.target }}"
          mkdir -p dist
          strip -o "dist/${name}" "build/${name}"
          tar -C dist -cJf "${pkg}.tar.xz" "${name}"
          sha256sum "${pkg}.tar.xz" | tee "${pkg}.tar.xz.sha256"

      - name: Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: qemu-${{ matrix.target }}-${{ matrix.host }}
          path: qemu-*.tar.xz
          if-no-files-found: error

