name: Dependency Build

on:
  workflow_call:
    inputs:
      qemu_version:
        type: string
        required: true
      cmake_version:
        type: string
        required: true

env:
  REPOSITORY: hyperion-project
  SECRET_DOCKER_CI: ${{ secrets.DOCKER_CI }}

jobs:
  build_qemu:
    name: QEMU v${{ inputs.qemu_version }}
    runs-on: ubuntu-latest
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v7

      - name: ✅ Determine current Repository
        if: ${{ !startsWith(github.repository, env.REPOSITORY) }}
        run: echo "REPOSITORY=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to GitHub Container Registry
        if: ${{ env.SECRET_DOCKER_CI != null }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_CI }}

      - name: 👷 Build and 🚀 Push to GitHub Container/Package Registry
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./qemu
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.REPOSITORY }}/qemu:latest
          labels: org.opencontainers.image.source=https://github.com/${{ env.REPOSITORY }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: QEMU_VERSION=${{ inputs.qemu_version }}

  build_cmake:
    name: CMake v${{ inputs.cmake_version }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: armv6
            platform: linux/arm/v6
            runner: ubuntu-24.04-arm
            base_image: raspbian
          - slug: armv7
            platform: linux/arm/v7
            runner: ubuntu-24.04-arm
            base_image: ubuntu:20.04
          - slug: riscv64
            platform: linux/riscv64
            runner: ubuntu-24.04-riscv
            base_image: ubuntu:20.04
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v7

      - name: ✅ Determine current Repository
        if: ${{ !startsWith(github.repository, env.REPOSITORY) }}
        run: echo "REPOSITORY=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to GitHub Container Registry
        if: ${{ env.SECRET_DOCKER_CI != null }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_CI }}

      - name: 👷 Build and 🚀 Push to GitHub Container/Package Registry
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ./cmake
          target: out
          allow: security.insecure
          platforms: ${{ matrix.platform }}
          push: ${{ github.event_name != 'pull_request' }}
          labels: org.opencontainers.image.source=https://github.com/${{ env.REPOSITORY }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=cmake-${{ matrix.slug }}
          cache-to: type=gha,scope=cmake-${{ matrix.slug }},mode=max
          build-args: |
            CMAKE_VERSION=${{ inputs.cmake_version }}
            BASE_IMAGE=${{ matrix.base_image }}
          outputs: |
            type=image,name=ghcr.io/${{ env.REPOSITORY }}/cmake:latest-${{ matrix.slug }},push=${{ github.event_name != 'pull_request' }}
            type=local,dest=out

      - name: 📦 Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: cmake-${{ inputs.cmake_version }}-linux-${{ matrix.slug }}
          path: out/cmake-*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: 👷 Merge and 🚀 Push
    needs: build_cmake
    runs-on: ubuntu-latest
    steps:
      - name: ✅ Determine current Repository
        if: ${{ !startsWith(github.repository, env.REPOSITORY) }}
        run: echo "REPOSITORY=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to GitHub Container Registry
        if: ${{ env.SECRET_DOCKER_CI != null }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_CI }}

      - name: 📝 Create manifest list and 🚀 Push to GitHub Container/Package Registry
        run: |
          sources=()
          for slug in armv6 armv7 riscv64; do
            sources+=("${IMAGE_NAME}:latest-${slug}")
          done
          docker buildx imagetools create -t "${IMAGE_NAME}:${CMAKE_VERSION}" "${sources[@]}"
          docker buildx imagetools inspect "${IMAGE_NAME}:${CMAKE_VERSION}"
        env:
          IMAGE_NAME: ghcr.io/${{ env.REPOSITORY }}/cmake
          CMAKE_VERSION: ${{ inputs.cmake_version }}
