name: Package Repository
run-name: |
  ${{ github.event_name == 'schedule' && '⏰ Scheduled build' || '' }}
  ${{ github.event_name == 'push' && format('🌱 Push build - {0}', github.event.head_commit.message) || '' }}

on:
  schedule:
    - cron: '0 0 * * 0'
  push:
    branches: [ staging ]

env:
  REPOSITORY: hyperion-project
  SECRET_DOCKER_CI: ${{ secrets.DOCKER_CI }}
  QEMU_VERSION: 11.1.1
  CMAKE_VERSION: 4.4.4
  OPENSSL_VERSION: 3.6.0

jobs:

  build_qemu:
    name: Build QEMU
    runs-on: ubuntu-24.04-arm
    steps:
      - name: 👀 Checkout
        uses: actions/checkout@v7

      - name: ✅ Determine current Repository
        if: ${{ !startsWith(github.repository, env.REPOSITORY) }}
        run: echo "REPOSITORY=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to GitHub Container Registry
        if: ${{ env.SECRET_DOCKER_CI != null }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_CI }}

      - name: 👷 Build and 🚀 Push to GitHub Container/Package Registry
        uses: docker/build-push-action@v7
        with:
          context: ./qemu
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          allow: security.insecure
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.REPOSITORY }}/qemu:latest
          labels: org.opencontainers.image.source=https://github.com/${{ env.REPOSITORY }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=ghcr.io/${{ env.REPOSITORY }}/qemu:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPOSITORY }}/qemu:buildcache,mode=max
          build-args: |
            QEMU_VERSION=${{ env.QEMU_VERSION }}

  build_cmake:
    name: Build CMake
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: ✅ Determine current Repository
        if: ${{ !startsWith(github.repository, env.REPOSITORY) }}
        run: echo "REPOSITORY=$(echo '${{ github.actor }}' | tr '[:upper:]' '[:lower:]')" >> ${GITHUB_ENV}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        if: ${{ env.SECRET_DOCKER_CI != null }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_CI }}

      - name: 👷 Build and 🚀 Push to GitHub Container/Package Registry
        uses: docker/build-push-action@v7
        with:
          context: ./cmake
          file: ./cmake/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v6,linux/arm/v7
          allow: security.insecure
          push: ${{ github.event_name != 'pull_request' }}
          tags: ghcr.io/${{ env.REPOSITORY }}/cmake:latest
          labels: org.opencontainers.image.source=https://github.com/${{ env.REPOSITORY }}
          provenance: mode=max
          sbom: true
          cache-from: type=registry,ref=ghcr.io/${{ env.REPOSITORY }}/cmake:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ env.REPOSITORY }}/cmake:buildcache,mode=max
          build-args: |
            CMAKE_VERSION=${{ env.CMAKE_VERSION }}
            OPENSSL_VERSION=${{ env.OPENSSL_VERSION }}

  build_image:
    name: 🐧 ${{ matrix.os.description }} Qt ${{ matrix.qt_version }}
    needs: [ build_qemu, build_cmake ]
    strategy:
      fail-fast: false
      matrix:
        os: [
          # Ubuntu
          { distribution: ubuntu, codename: jammy,    description: Ubuntu 22.04 LTS (Jammy Jellyfish),  target_platform: "['amd64', 'arm64', 'armv7']" },
          { distribution: ubuntu, codename: noble,    description: Ubuntu 24.04 LTS (Noble Numbat),     target_platform: "['amd64', 'arm64', 'armv7']" },
          { distribution: ubuntu, codename: resolute, description: Ubuntu 26.04 LTS (Resolute Raccoon), target_platform: "['amd64', 'arm64', 'armv7']" },
          { distribution: ubuntu, codename: stonking, description: Ubuntu 26.10 (Stonking Stingray),    target_platform: "['amd64', 'arm64', 'armv7']" },
         
          # Debian
          { distribution: debian, codename: bookworm, description: Debian 12.x (Bookworm),              target_platform: "['amd64', 'arm64', 'armv6', 'armv7']" },
          { distribution: debian, codename: trixie,   description: Debian 13.x (Trixie),                target_platform: "['amd64', 'arm64', 'armv6', 'armv7']" },
          { distribution: debian, codename: forky,    description: Debian 14.x (Forky),                 target_platform: "['amd64', 'arm64', 'armv6', 'armv7']" },
          
          # Fedora
          { distribution: fedora, codename: 42,       description: Fedora 42,                           target_platform: "['amd64', 'arm64']" },
          { distribution: fedora, codename: 43,       description: Fedora 43,                           target_platform: "['amd64', 'arm64']" },
          { distribution: fedora, codename: 44,       description: Fedora 44,                           target_platform: "['amd64', 'arm64']" },
          { distribution: fedora, codename: 45,       description: Fedora 45,                           target_platform: "['amd64', 'arm64']" },
          { distribution: fedora, codename: 46,       description: Fedora 46,                           target_platform: "['amd64', 'arm64']" }
        ]
        qt_version: [ 5, 6 ]

    uses: ./.github/workflows/qt5_6.yml
    secrets: inherit
    with:
      distribution: ${{ matrix.os.distribution }}
      codename: ${{ matrix.os.codename }}
      qt_version: ${{ matrix.qt_version }}
      target_platform: ${{ matrix.os.target_platform }}

  cleanup:
    name: 🧹 Cleanup untagged images
    needs: build_image
    if: ${{ needs.build_image.result == 'success' }}
    env:
      SECRET_DOCKER_CI: ${{ secrets.DOCKER_CI }}
    runs-on: ubuntu-latest
    steps:
      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: 🔑 Login to GitHub Container Registry
        if: ${{ env.SECRET_DOCKER_CI != null }}
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.DOCKER_CI }}

      - name: 🧹 Cleanup
        if: ${{ env.SECRET_DOCKER_CI != null }}
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.DOCKER_CI }}
          packages: "*"
          expand-packages: true
          delete-untagged: true
          delete-partial-images: true
          delete-orphaned-images: true
          validate: true