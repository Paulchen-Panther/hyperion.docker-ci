name: Raspbian Docker Images
run-name: |
  ${{ github.event_name == 'schedule' && '⏰ Scheduled build' || '' }}
  ${{ github.event_name == 'push' && format('🌱 Push build - {0}', github.event.head_commit.message) || '' }}
  ${{ github.event_name == 'workflow_dispatch' && '🔧 Manual build' || '' }}

on:
  schedule:
    - cron: '0 2 * * 0'
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:

  build:
    name: 🍓 Raspbian ${{ matrix.suite }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        suite: [bullseye, bookworm]

    env:
      ARCH: armhf
      SUITE: ${{ matrix.suite }}
      MIRROR: http://raspbian.raspberrypi.org/raspbian/
      KEYRING: /usr/share/keyrings/raspbian-archive-keyring.gpg

    steps:
      - name: 📦 Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            debuerreotype \
            debootstrap \
            gnupg \
            qemu-user-static \
            raspbian-archive-keyring \
            wget \
            xz-utils

      - name: 🔧 Set up QEMU (registers binfmt handlers for ARM emulation)
        uses: docker/setup-qemu-action@v3

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔑 Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build Raspbian rootfs
        run: |
          WORKDIR="$(mktemp -d /tmp/raspbian-build.XXXXXXXX)"
          echo "WORKDIR=${WORKDIR}" >> "${GITHUB_ENV}"

          echo "==> Building Raspbian ${SUITE} (${ARCH}) rootfs..."
          sudo debuerreotype-init \
            --arch "${ARCH}" \
            --keyring "${KEYRING}" \
            "${WORKDIR}/rootfs" \
            "${SUITE}" \
            "${MIRROR}"

          sudo debuerreotype-minimizing-config "${WORKDIR}/rootfs"

          echo "==> Creating rootfs tarball..."
          sudo debuerreotype-tar "${WORKDIR}/rootfs" "${WORKDIR}/rootfs.tar.xz"
          sudo chown "$(id -u):$(id -g)" "${WORKDIR}/rootfs.tar.xz"

      - name: 🐳 Build Docker image
        run: |
          printf 'FROM scratch\nADD rootfs.tar.xz /\nCMD ["/bin/bash"]\n' \
            > "${WORKDIR}/Dockerfile"

          echo "==> Building Docker image: raspbian:${SUITE} (platform linux/arm/v6)"
          docker buildx build \
            --platform "linux/arm/v6" \
            --file "${WORKDIR}/Dockerfile" \
            --tag "raspbian:${SUITE}" \
            --load \
            "${WORKDIR}"

      - name: 🚀 Push to GitHub Container Registry
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          IMAGE="ghcr.io/${OWNER}/raspbian:${SUITE}"
          docker tag "raspbian:${SUITE}" "${IMAGE}"
          docker push "${IMAGE}"
          echo "Pushed ${IMAGE}"

      - name: 👀 Inspect image manifest
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          docker buildx imagetools inspect "ghcr.io/${OWNER}/raspbian:${SUITE}"

      - name: 🧹 Cleanup build directory
        if: always()
        run: sudo rm -rf "${WORKDIR}"
